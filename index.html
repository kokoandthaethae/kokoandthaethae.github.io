
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 7th Anniversary!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff7eb3;
            --secondary-pink: #ffb8d2;
            --bg-pink: #ffe6f0;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #ffe6f0 0%, #ffcbe0 100%);
            font-family: 'Padauk', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Hanging Balloons */
        .balloons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            display: flex;
            justify-content: space-around;
        }

        .hanging-balloon {
            position: relative;
            transform-origin: top center;
            animation: sway 3s ease-in-out infinite alternate;
        }

        .hanging-balloon .string {
            width: 2px;
            height: 100px;
            background: rgba(255, 255, 255, 0.6);
            margin: 0 auto;
        }

        .hanging-balloon .balloon {
            width: 60px;
            height: 75px;
            background: radial-gradient(circle at 30% 30%, #ff9a9e, #ff7eb3);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: relative;
            box-shadow: 0 10px 15px rgba(255, 126, 179, 0.3);
        }

        .hanging-balloon .balloon::before {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid #ff7eb3;
        }

        @keyframes sway {
            0% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }

        /* Scenes */
        .scene {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 1s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        .scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Intro Animation */
        .intro-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #d81b60;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
            transform: scale(0.5);
            animation: popIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .intro-subtext {
            font-size: 1.5rem;
            color: #c2185b;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeIn 2s ease forwards 1s;
        }

        @keyframes popIn {
            to { transform: scale(1); opacity: 1; }
        }

        /* Box Animation */
        #box-scene {
            transform: translateY(100vh);
        }
        
        #box-scene.slide-up {
            transform: translateY(0);
            opacity: 1;
        }

        .gift-box-container {
            position: relative;
            width: 150px;
            height: 150px;
            cursor: pointer;
        }

        .shake-fade {
            animation: shakeFadeAnim 1.5s ease-in-out forwards;
        }
@keyframes shakeFadeAnim {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            10% { transform: translate(-10px, 0) scale(1.1) rotate(-5deg); }
            20% { transform: translate(10px, 0) scale(1.1) rotate(5deg); }
            30% { transform: translate(-10px, 0) scale(1.1) rotate(-5deg); }
            40% { transform: translate(10px, 0) scale(1.1) rotate(5deg); }
            50% { transform: translate(0, 0) scale(1.2) rotate(0); opacity: 1; }
            100% { transform: translate(0, -50px) scale(1.5); opacity: 0; }
        }

        /* Reveal Scene */
        .photo-frame {
            background: white;
            padding: 15px;
            padding-bottom: 40px;
            border-radius: 10px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            transform: scale(0) rotate(-5deg);
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 80%;
            max-height: 50vh;
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            max-height: 40vh;
            object-fit: cover;
            border-radius: 5px;
        }

        .reveal-active .photo-frame {
            transform: scale(1) rotate(-2deg);
        }

        .message-box {
            margin-top: 30px;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease 1s;
        }

        .reveal-active .message-box {
            opacity: 1;
            transform: translateY(0);
        }

        .love-text {
            color: #ad1457;
            font-size: 1.3rem;
            line-height: 1.8;
            background: rgba(255, 255, 255, 0.6);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            max-width: 90%;
            margin: 0 auto;
        }

        .conclusion-text {
            font-weight: bold;
            color: #d81b60;
            font-size: 1.5rem;
            margin-top: 15px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* Floating Hearts */
        .heart-bg {
            position: absolute;
            font-size: 20px;
            color: #ff4081;
            opacity: 0.3;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        @media (min-width: 768px) {
            .intro-text { font-size: 5rem; }
            .intro-subtext { font-size: 2.5rem; }
            .love-text { font-size: 1.8rem; }
            .conclusion-text { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Background Floating Hearts -->
    <div id="hearts-container"></div>

    <!-- Hanging Balloons from top -->
    <div class="balloons-container">
        <div class="hanging-balloon" style="animation-delay: 0s;"><div class="string" style="height: 80px;"></div><div class="balloon"></div></div>
        <div class="hanging-balloon" style="animation-delay: 1.5s;"><div class="string" style="height: 120px;"></div><div class="balloon"></div></div>
        <div class="hanging-balloon" style="animation-delay: 0.5s;"><div class="string" style="height: 90px;"></div><div class="balloon"></div></div>
        <div class="hanging-balloon" style="animation-delay: 2s; display: none; sm:display:block;"><div class="string" style="height: 140px;"></div><div class="balloon"></div></div>
        <div class="hanging-balloon" style="animation-delay: 1s;"><div class="string" style="height: 100px;"></div><div class="balloon"></div></div>
    </div>

    <!-- SCENE 1: Intro -->
    <div id="scene1" class="scene active">
        <div class="intro-text">Happy 7th Anniversary</div>
        <div class="intro-subtext font-bold">သဲသဲလေးရ ❤️</div>
    </div>
<!-- SCENE 2: Surprise Box -->
    <div id="scene2" class="scene">
        <div class="gift-box-container" id="gift-box">
            <!-- Cute SVG Gift Box with ? -->
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <!-- Box Body -->
                <rect x="15" y="40" width="70" height="55" fill="#ff4081" rx="5" />
                <!-- Ribbon Vertical -->
                <rect x="42" y="40" width="16" height="55" fill="#ffe6f0" />
                <!-- Lid -->
                <rect x="10" y="30" width="80" height="15" fill="#d81b60" rx="3" />
                <!-- Ribbon Horizontal on Lid -->
                <rect x="42" y="30" width="16" height="15" fill="#ffe6f0" />
                <!-- Bow -->
                <path d="M 50 30 C 30 10, 10 30, 45 30 Z" fill="#ff4081" />
                <path d="M 50 30 C 70 10, 90 30, 55 30 Z" fill="#ff4081" />
                <!-- Center Knot -->
                <circle cx="50" cy="30" r="5" fill="#d81b60" />
                <!-- Question Mark -->
                <text x="50" y="80" font-family="Arial" font-size="35" font-weight="bold" fill="white" text-anchor="middle">?</text>
            </svg>
        </div>
    </div>

    <!-- SCENE 3: Photo & Message -->
    <div id="scene3" class="scene">
        <!-- Photo Frame -->
        <div class="photo-frame">
            <!-- CHANGE THE IMAGE URL HERE -->
            <img src="./img/ereceip.jpg" alt="သဲသဲလေးဝယ်ချင်ရာဝယ်">
        </div>
        
        <!-- Message Box -->
        <div class="message-box">
            <div class="love-text">
                <p>သဲသဲအတွက် Style Pant Suprise😇💗</p>
                <p>ရှေ့ဆက်ပြီးတော့လည်း ဒီလက်တွေတွဲထားပြီး</p>
                <p>အမြဲတမ်း ပျော်ရွှင်စွာဖြတ်သန်းသွားကြမယ်နော်...</p>
                <p class="conclusion-text">အများကြီးချစ်ပေးလို့ ကျေးဇူးပါသဲသဲရယ် 😘❤️</p>
            </div>
        </div>
    </div>

    <script>
        // Generate Floating Background Hearts
        function createHearts() {
            const container = document.getElementById('hearts-container');
            for(let i=0; i<15; i++) {
                let heart = document.createElement('div');
                heart.innerHTML = '❤';
                heart.className = 'heart-bg';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                heart.style.animationDelay = Math.random() * 5 + 's';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                container.appendChild(heart);
            }
        }
        createHearts();

        // Animation Timeline Controller
        document.addEventListener("DOMContentLoaded", () => {
            const scene1 = document.getElementById('scene1');
            const scene2 = document.getElementById('scene2');
            const scene3 = document.getElementById('scene3');
            const giftBox = document.getElementById('gift-box');

            // 1. Show Intro for 4 seconds, then fade out and show Box Scene
            setTimeout(() => {
                scene1.classList.remove('active');
                
                setTimeout(() => {
                    scene2.classList.add('active');
                    scene2.classList.add('slide-up');
                    
                    // 2. Wait for User Click/Touch to open the box
                    let isOpened = false;
                    giftBox.addEventListener('click', () => {
                        if (isOpened) return; // ခလုတ်နှစ်ခါနှိပ်မိတာမျိုးမဖြစ်အောင် တားထားပါမယ်
                        isOpened = true;

                        // Start shake and fade out animation
                        giftBox.classList.add('shake-fade');
// 3. After animation finishes, hide Box and show Photo
                        setTimeout(() => {
                            scene2.classList.remove('active');
                            
                            setTimeout(() => {
                                scene3.classList.add('active');
                                // slight delay before triggering CSS transform for the frame
                                setTimeout(() => {
                                    scene3.classList.add('reveal-active');
                                }, 100);
                                
                            }, 500); // Wait for box to hide completely

                        }, 1500); // Wait for the shake-fade animation duration (1.5s)
                    });

                }, 1000); // Wait for intro to fade out

            }, 4000); // Show intro for 4 seconds
        });
    </script>
</body>
</html>
